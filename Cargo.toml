[package]
name = "space-travel"
version = "0.1.0"
edition = "2024"
description = "An orbital-mechanics flight game for the terminal and the browser"
license = "MIT"

# Terminal: ratatui + crossterm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ratatui = { version = "0.30", features = ["crossterm", "all-widgets"] }

# Browser: draws on an HTML canvas through web-sys.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "KeyboardEvent",
    "Window",
] }

[profile.release]
opt-level = 3
lto = true

